# Publish dsh-weixin-ilink to npm.
#
# Trigger: GitHub Release published (create a release on a v* tag), or manual
# workflow_dispatch. Registers as an npm trusted publisher: the /access form on
# the npm package page wants exactly this filename ("publish.yml") plus the
# repository and an optional environment name.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: npm exchanges the workflow identity for a publish token.

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-24.04
    # Secrets are not readable from `if:`, so the fallback choice is decided here.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the Node 22 bundle is older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Self-check
        run: node test/selfcheck.mjs

      # On a release run, refuse to publish bytes whose version does not match
      # the tag, so a forgotten `npm version` bump cannot shadow a release.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      # Credential, in order of preference:
      # 1. OIDC trusted publishing (id-token: write above): the npm package page
      #    lists this repository and this workflow filename once, and no stored
      #    token exists anywhere.
      # 2. An `NPM_TOKEN` repository secret holding an npm automation token, for
      #    a package whose page has no trusted publisher yet.
      - name: Publish with trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public --provenance

      - name: Publish with NPM_TOKEN
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
